[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-pdf-diff"
version = "0.2.0"
description = "Evidence-first multimodal engineering PDF comparison for small VLMs"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24.3,<2", "pydantic>=2.7,<3", "tqdm>=4.60,<5"]

[project.optional-dependencies]
# Synthetic sample generation and its tests.
dev = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pillow>=11,<13", "pyclipper>=1.3,<2"]
# Word documents (.docx): MIT-licensed, unlike PyMuPDF's AGPL (docs/plans/multi-format-adapters-2026-09-23.md).
# Pillow (MIT-CMU) and pyclipper (MIT) serve the vendored metafile renderer, for pictures drawn as EMF or WMF.
office = ["python-docx>=1.1,<2", "pillow>=11,<13", "pyclipper>=1.3,<2"]
# The evaluation and bench tooling, and the commands it adds (review, queries): lab/, its own distribution.
lab = ["semantic-pdf-diff-lab==0.2.0"]

[project.scripts]
pdf-semantic-diff = "semantic_pdf_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# vendored code ships with its license (src/semantic_pdf_diff/vendor/README.md)
"semantic_pdf_diff.vendor.metafile_render" = ["LICENSE", "py.typed"]
