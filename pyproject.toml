[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-pdf-diff"
version = "0.17.0"
description = "Evidence-first multimodal engineering PDF comparison for small VLMs"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24.3,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
# Synthetic sample generation and its tests. pyte (LGPL-3.0, tests only) is a terminal emulator: the progress bars'
# tests read what a terminal would show (docs/plans/progress-display-2026-10-20.md).
dev = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pillow>=11,<13", "pyclipper>=1.3,<2", "pyte>=0.8,<1"]
# Word documents (.docx): MIT-licensed, unlike PyMuPDF's AGPL.
# Pillow (MIT-CMU) and pyclipper (MIT) serve the vendored metafile renderer, for pictures drawn as EMF or WMF.
office = ["python-docx>=1.1,<2", "pillow>=11,<13", "pyclipper>=1.3,<2", "openpyxl>=3.1,<4"]
# The evaluation and bench tooling, and the commands it adds (review, queries): lab/, its own distribution.
lab = ["semantic-pdf-diff-lab==0.17.0"]

[project.scripts]
semantic-pdf-diff = "semantic_pdf_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# vendored code ships with its license (src/semantic_pdf_diff/vendor/README.md)
"semantic_pdf_diff.vendor.metafile_render" = ["LICENSE", "py.typed"]
# the report page's scripts (report.py)
"semantic_pdf_diff" = ["report.js", "search.js"]

[tool.ruff]
line-length = 120
# archived prototypes, and vendored code kept as its authors wrote it
extend-exclude = ["docs/research", "src/semantic_pdf_diff/vendor"]

[tool.ruff.lint]
# pyflakes, long lines, and closures over a loop's variable (a callback run after the loop sees its last value);
# tests/test_lint.py keeps the tree clean
select = ["F", "E501", "B023"]
