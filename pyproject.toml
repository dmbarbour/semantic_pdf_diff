[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-pdf-diff"
version = "0.1.1"
description = "Evidence-first multimodal engineering PDF comparison for small VLMs"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24,<2", "pydantic>=2.7,<3"]

[project.scripts]
pdf-semantic-diff = "semantic_pdf_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
